spring:
  application:
    name: keyfalls-api

  datasource:
    url: jdbc:h2:mem:keyfallsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

keyfalls:
  security:
    jwt:
      issuer: ${JWT_ISSUER:https://api.keyfalls.com.br}
      secret: ${JWT_HMAC_SECRET:chave-secreta-assinatura-hmac-sha256-minimo-32-bytes-keyfalls-prod}
      access-token-expiration: ${JWT_EXPIRATION:PT2H}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
